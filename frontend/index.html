<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimberBIM Lite - timber framing workspace</title>
  <style>
    :root {
      --bg: #171c23; --panel: #222a34; --panel-2: #192029;
      --line: #374251; --text: #e8edf4; --dim: #9eabba;
      --accent: #f59e0b; --accent-dark: #251805; --danger: #ef4444;
      --rail: 64px; --sidebar: 460px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    #viewport {
      position: absolute; inset: 0; transition: left .22s ease;
    }
    body.sidebar-pinned #viewport { left: var(--sidebar); }
    #viewport canvas { display: block; }
    #viewport.loading::after {
      content: "Generating framing...";
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(20, 24, 30, .48); color: #fff; font-size: 18px;
    }
    #viewport[data-error]:not([data-error=""])::before {
      content: attr(data-error); position: absolute; z-index: 3;
      top: 18px; right: 18px; max-width: 420px; padding: 12px 16px;
      border-radius: 8px; background: #7f1d1d; color: white;
    }
    #sidebar {
      position: fixed; z-index: 20; inset: 0 auto 0 0;
      width: var(--rail); display: flex; overflow: hidden;
      background: var(--panel); border-right: 1px solid var(--line);
      box-shadow: 12px 0 30px rgba(0, 0, 0, .18);
      transition: width .22s ease;
    }
    #sidebar:hover, #sidebar:focus-within, #sidebar.pinned { width: var(--sidebar); }
    .sidebar-rail {
      width: var(--rail); min-width: var(--rail); padding: 10px 7px;
      display: flex; flex-direction: column; border-right: 1px solid var(--line);
      background: #1d242d;
    }
    .brand-mark {
      width: 42px; height: 42px; margin: 0 auto 10px; display: grid;
      place-items: center; border-radius: 10px; background: var(--accent);
      color: var(--accent-dark); font-weight: 900; letter-spacing: -.04em;
    }
    .sidebar-rail nav { display: flex; flex: 1; flex-direction: column; gap: 5px; }
    .nav-button, .pin-button {
      width: calc(var(--sidebar) - 15px); height: 43px; padding: 0;
      display: flex; align-items: center; gap: 14px; border: 0;
      border-radius: 8px; background: transparent; color: var(--dim);
      cursor: pointer; white-space: nowrap;
    }
    .nav-button:hover, .pin-button:hover, .nav-button.active {
      background: #2d3744; color: var(--text);
    }
    .nav-button.active { box-shadow: inset 3px 0 var(--accent); }
    .nav-icon {
      width: 49px; min-width: 49px; text-align: center;
      font-size: 11px; font-weight: 800; letter-spacing: .05em;
    }
    .nav-label { opacity: 0; transition: opacity .12s ease .08s; }
    #sidebar:hover .nav-label, #sidebar:focus-within .nav-label,
    #sidebar.pinned .nav-label { opacity: 1; }
    .sidebar-content {
      width: calc(var(--sidebar) - var(--rail)); min-width: calc(var(--sidebar) - var(--rail));
      height: 100%; overflow-y: auto; padding: 18px 18px 30px;
      opacity: 0; transition: opacity .12s ease;
    }
    #sidebar:hover .sidebar-content, #sidebar:focus-within .sidebar-content,
    #sidebar.pinned .sidebar-content { opacity: 1; }
    .sidebar-content header { margin-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
    h1 span { color: var(--accent); }
    .sidebar-content header p, .sub { margin: 3px 0 0; color: var(--dim); font-size: 12px; }
    .panel-title {
      margin: 0 0 14px; font-size: 17px; color: var(--text);
      text-transform: none; letter-spacing: 0;
    }
    section { margin-bottom: 17px; }
    section h2, h3 {
      margin: 0 0 7px; color: var(--dim); font-size: 11px;
      text-transform: uppercase; letter-spacing: .12em;
    }
    .seg, .tabs, .button-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .seg button, .tab, .primary-button, .secondary-button, .danger-button,
    .export, .clear-override, .table-delete {
      border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
      background: transparent; color: var(--text); cursor: pointer;
    }
    .seg button { flex: 1; }
    .seg button.on, .tab.active, .primary-button, .export {
      background: var(--accent); border-color: var(--accent);
      color: var(--accent-dark); font-weight: 700;
    }
    .secondary-button:hover, .clear-override:hover, .table-delete:hover {
      border-color: var(--accent);
    }
    .danger-button { width: 100%; margin-top: 15px; border-color: var(--danger); color: #fecaca; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .export { width: 100%; margin: 4px 0 10px; }
    .clear-override { width: 100%; color: var(--dim); }
    .field { display: block; margin: 8px 0 4px; }
    .field > label, .field > span, .field label {
      display: block; margin-bottom: 3px; color: var(--dim); font-size: 12px;
    }
    .field input, .field select, .field textarea, .filter-grid input,
    .filter-grid select, .price-override {
      width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 7px; background: var(--panel-2); color: var(--text);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .check-field { align-self: center; padding-top: 12px; color: var(--text); }
    .check-field input, .layer input { accent-color: var(--accent); }
    .layer { display: block; padding: 3px 0; cursor: pointer; }
    .subform {
      display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px;
      margin: 8px 0; padding: 10px; border: 1px solid var(--line);
      border-radius: 8px;
    }
    .subform legend { color: var(--accent); font-size: 12px; }
    .subform .table-delete { align-self: end; margin-bottom: 4px; }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 8px; }
    .filter-grid input { grid-column: 1 / -1; }
    .table-wrap {
      max-width: 100%; max-height: 55vh; overflow: auto; margin: 10px 0;
      border: 1px solid var(--line); border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; white-space: nowrap; }
    th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    th { position: sticky; top: 0; z-index: 1; background: #2a3440; color: var(--dim); }
    tr.invalid { background: rgba(127, 29, 29, .35); }
    td[contenteditable="true"] { min-width: 85px; background: rgba(255,255,255,.025); }
    .vision-json {
      width: 280px; padding: 7px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--panel-2); color: var(--text);
      font: 11px/1.35 ui-monospace, monospace; white-space: pre;
    }
    .invalid-input { border-color: var(--danger) !important; }
    a { color: #fbbf24; }
    .drop-zone {
      display: grid; gap: 4px; place-items: center; min-height: 118px;
      margin: 8px 0; padding: 16px; border: 1px dashed #667487;
      border-radius: 10px; background: var(--panel-2); color: var(--dim);
      text-align: center; cursor: pointer;
    }
    .drop-zone.dragging { border-color: var(--accent); background: #2a2a20; }
    .drop-zone.compact { min-height: 78px; }
    .drop-zone input { max-width: 100%; }
    .notice, .hint, .stats { color: var(--dim); font-size: 11.5px; }
    .callout, .message {
      margin: 7px 0; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 7px; background: var(--panel-2); font-size: 12px;
    }
    .callout { border-color: #a16207; color: #fde68a; }
    .message.error, .warn, .warn-note { color: #fecaca; border-color: #7f1d1d; }
    .message.warning { color: #fde68a; border-color: #854d0e; }
    .message.success { color: #bbf7d0; border-color: #166534; }
    .batch-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line);
      color: var(--dim); font-size: 12px;
    }
    .key { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 12px; }
    .key i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #ffffff44; }
    .key b { margin-left: auto; color: var(--dim); }
    .info {
      min-height: 44px; padding: 10px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--panel-2); color: var(--dim);
    }
    .info .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
    .info .row b { color: var(--text); text-align: right; }
    #spacing-note { color: #93c5fd; }
    @media (max-width: 900px) {
      :root { --sidebar: 410px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main id="viewport" aria-label="Interactive 3D BIM model"></main>
  <aside id="sidebar" aria-label="TimberBIM workspace panels"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
