<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimberBIM Lite — NZS 3604:2011</title>
  <style>
    :root {
      --bg: #1c2128; --panel: #242b35; --line: #36404e;
      --text: #e6ebf2; --dim: #9aa7b8; --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text); background: var(--bg);
      display: flex; height: 100vh; overflow: hidden;
    }
    #viewport { flex: 1; position: relative; }
    #viewport canvas { display: block; }
    #viewport.loading::after {
      content: "Generating framing…";
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(20, 24, 30, .45); color: #fff;
      font-size: 18px; letter-spacing: .04em;
    }
    #panel {
      width: 340px; min-width: 340px; overflow-y: auto;
      background: var(--panel); border-left: 1px solid var(--line);
      padding: 18px 18px 24px;
    }
    h1 { font-size: 22px; letter-spacing: .02em; }
    h1 span { color: var(--accent); }
    .sub { color: var(--dim); margin: 2px 0 14px; font-size: 12.5px; }
    section { margin-bottom: 16px; }
    h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--dim); margin-bottom: 7px;
    }
    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1; padding: 7px 0; border: 1px solid var(--line);
      background: transparent; color: var(--text); border-radius: 7px;
      cursor: pointer; font-size: 13px;
    }
    .seg button.on { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 600; }
    .layer { display: block; padding: 3px 0; color: var(--text); cursor: pointer; }
    .layer input { accent-color: var(--accent); margin-right: 8px; }
    .field { margin: 8px 0 4px; }
    .field label {
      display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px;
    }
    .field select, .field input[type="number"] {
      width: 100%; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 7px; background: #1b212a; color: var(--text);
      font-size: 13px;
    }
    .field select:focus, .field input:focus { outline: 1px solid var(--accent); }
    .warn-note { color: #fca5a5; margin-top: 4px; }
    #spacing-note { color: #93c5fd; margin-top: 8px; }
    .key {
      display: flex; align-items: center; gap: 8px;
      padding: 2.5px 0; font-size: 12.5px;
    }
    .key i {
      width: 14px; height: 14px; border-radius: 4px; flex: none;
      border: 1px solid rgba(255,255,255,.25);
    }
    .key b { margin-left: auto; color: var(--dim); font-weight: 500; }
    .info {
      background: #1b212a; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; font-size: 13px; color: var(--dim); min-height: 44px;
    }
    .info .row { display: flex; justify-content: space-between; padding: 2px 0; }
    .info .row span { color: var(--dim); }
    .info .row b { color: var(--text); font-weight: 600; text-align: right; }
    .info .warn { margin-top: 8px; color: #fca5a5; font-size: 12.5px; }
    .export {
      width: 100%; padding: 11px; border: none; border-radius: 8px;
      background: var(--accent); color: #1a1206; font-weight: 700;
      font-size: 14px; cursor: pointer; margin: 4px 0 10px;
    }
    .export:hover { filter: brightness(1.08); }
    .clear-override {
      width: 100%; padding: 7px; margin: 6px 0; border-radius: 7px;
      border: 1px solid var(--line); background: transparent;
      color: var(--dim); font-size: 12px; cursor: pointer;
    }
    .clear-override:hover { color: var(--text); border-color: var(--accent); }
    .stats { color: var(--text); font-size: 12.5px; margin-bottom: 8px; }
    .hint { color: var(--dim); font-size: 11.5px; }
    .info .hint a { color: var(--accent); }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <aside id="panel"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
